<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionLedger - packages and how the app reaches them</text>
  <text class="subtitle" x="40" y="78">The core issues, verifies, rotates and revokes keys; the ASP.NET Core and EF Core packages plug in at the request edge and at the store.</text>

  <!-- row 1: request edge -->
  <rect class="ext" x="40" y="110" width="270" height="100" rx="14"/>
  <text class="label" x="175" y="145" text-anchor="middle">API client</text>
  <text class="code" x="175" y="170" text-anchor="middle">X-Api-Key: ork_...</text>
  <text class="small" x="175" y="192" text-anchor="middle">presents the key on each request</text>

  <path class="flow" d="M310,160 L388,160"/>
  <text class="edge" x="349" y="150" text-anchor="middle">request</text>

  <rect class="step" x="390" y="110" width="360" height="120" rx="14"/>
  <text class="label" x="570" y="138" text-anchor="middle">OrionLedger.AspNetCore</text>
  <text class="code" x="410" y="164">AddOrionLedgerApiKey()</text>
  <text class="code" x="410" y="186">ApiKeyAuthenticationHandler</text>
  <text class="code" x="410" y="208">RequireApiKeyScope, AddApiKeyScopePolicy</text>

  <path class="flow" d="M750,160 L828,160"/>
  <text class="edge" x="789" y="150" text-anchor="middle">principal</text>

  <rect class="ext" x="830" y="110" width="330" height="100" rx="14"/>
  <text class="label" x="995" y="142" text-anchor="middle">ASP.NET Core auth</text>
  <text class="code" x="995" y="166" text-anchor="middle">ClaimsPrincipal</text>
  <text class="small" x="995" y="190" text-anchor="middle">scope claims feed authorization policies</text>

  <path class="flow" d="M570,230 L570,288"/>
  <text class="code" x="582" y="264">VerifyAsync</text>

  <!-- row 2: core -->
  <rect class="step" x="40" y="290" width="270" height="130" rx="14"/>
  <text class="label" x="175" y="322" text-anchor="middle">Your app</text>
  <text class="code" x="60" y="350" style="font-variant-ligatures: none">AddOrionLedger(o =&gt; ...)</text>
  <text class="code" x="60" y="374">IssueAsync, VerifyAsync</text>
  <text class="code" x="60" y="398">RotateAsync, RevokeAsync</text>

  <path class="flow" d="M310,355 L388,355"/>
  <text class="edge" x="349" y="345" text-anchor="middle">calls</text>

  <rect class="step" x="390" y="290" width="360" height="270" rx="14"/>
  <text class="label" x="570" y="320" text-anchor="middle">OrionLedger (core)</text>
  <text class="code" x="410" y="352">IApiKeyService / ApiKeyService</text>
  <text class="code" x="410" y="378">ApiKeyOptions</text>
  <text class="code" x="410" y="404">ApiKeyGenerator, ApiKeyHasher</text>
  <text class="code" x="410" y="430">IApiKeyStore</text>
  <text class="code" x="410" y="456">InMemoryApiKeyStore (default)</text>
  <text class="code" x="410" y="482">IApiKeyEventObserver</text>
  <text class="code" x="410" y="508">ApiKeyDiagnostics</text>
  <text class="small" x="410" y="540">no ASP.NET Core or EF Core dependency</text>

  <rect class="ext" x="830" y="290" width="330" height="80" rx="14"/>
  <text class="label" x="995" y="322" text-anchor="middle">Orion.Abstractions</text>
  <text class="small" x="995" y="348" text-anchor="middle">OrionInstrumentation, OrionTelemetry names</text>

  <path class="flow" d="M750,330 L828,330"/>
  <text class="edge" x="789" y="320" text-anchor="middle">builds on</text>

  <rect class="ext" x="830" y="400" width="330" height="110" rx="14"/>
  <text class="label" x="995" y="428" text-anchor="middle">OpenTelemetry metrics</text>
  <text class="code" x="995" y="452" text-anchor="middle">meter Moongazing.OrionLedger</text>
  <text class="small" x="995" y="474" text-anchor="middle">orion.ledger.keys.issued / revoked / rotated</text>
  <text class="small" x="995" y="494" text-anchor="middle">orion.ledger.verifications (tag status)</text>

  <path class="flow" d="M750,455 L828,455"/>
  <text class="edge" x="789" y="445" text-anchor="middle">emits</text>

  <rect class="note" x="40" y="440" width="270" height="100" rx="10"/>
  <text class="small" x="56" y="468">Register your own IApiKeyStore</text>
  <text class="small" x="56" y="490">before AddOrionLedger() to replace</text>
  <text class="small" x="56" y="512">the in-memory store.</text>

  <!-- row 3: storage -->
  <path class="flow" d="M570,600 L570,562"/>
  <text class="edge" x="582" y="586">implements IApiKeyStore</text>

  <rect class="step" x="40" y="600" width="270" height="130" rx="14"/>
  <text class="label" x="175" y="630" text-anchor="middle">OrionLedger.Conformance</text>
  <text class="code" x="175" y="658" text-anchor="middle">ApiKeyStoreConformanceTests</text>
  <text class="small" x="175" y="684" text-anchor="middle">xUnit contract suite</text>
  <text class="small" x="175" y="704" text-anchor="middle">for any IApiKeyStore</text>

  <path class="flow" d="M310,665 L388,665"/>
  <text class="edge" x="349" y="655" text-anchor="middle">tests</text>

  <rect class="step" x="390" y="600" width="360" height="130" rx="14"/>
  <text class="label" x="570" y="630" text-anchor="middle">OrionLedger.EntityFrameworkCore</text>
  <text class="code" x="410" y="658">EfApiKeyStore&lt;TContext&gt;</text>
  <text class="code" x="410" y="682">ApiKeyRecordConfiguration</text>
  <text class="code" x="410" y="706">OrionLedgerDbContext</text>

  <path class="flow" d="M750,665 L828,665"/>
  <text class="edge" x="789" y="655" text-anchor="middle">persists</text>

  <rect class="ext" x="830" y="610" width="330" height="110" rx="14"/>
  <text class="label" x="995" y="642" text-anchor="middle">Relational database</text>
  <text class="small" x="995" y="666" text-anchor="middle">any EF Core relational provider</text>
  <text class="code" x="995" y="692" text-anchor="middle">table OrionLedgerApiKeys</text>
</svg>
